name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django

      - name: Build static site
        run: |
          mkdir -p docs
          mkdir -p docs/assets/{css,js,images}

          # 메인 페이지
          cp myproject/myapp/templates/index.html docs/index.html

          # 기타 페이지 (선택)
          cp myproject/myapp/templates/*.html docs/ || true

          # static 파일
          cp -r myproject/static/js/* docs/assets/js/ 2>/dev/null || true
          cp -r myproject/static/images/* docs/assets/images/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
